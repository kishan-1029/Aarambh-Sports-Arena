upstream arambh_api { server 127.0.0.1:7002; }
upstream arambh_mcp { server 127.0.0.1:7337; }

server {
    listen 8888 default_server;
    listen [::]:8888 default_server;
    server_name _;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://arambh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # RunPod terminates TLS; force https so session cookies work
        proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/ {
        proxy_pass http://arambh_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /mcp {
        proxy_pass http://arambh_mcp;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
    }

    location = /admin { return 302 /admin/; }

    location /admin/ {
        root /workspace/Odoo.Server/out;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        root /workspace/Odoo.Server/out/site;
        try_files $uri $uri/ /index.html;
    }
}
