# Single-domain reverse proxy for Arambh Sports Arena
# Host: sportsarena.aarambhevents.in
#
# Layout:
#   /           → customer-site (public)
#   /admin/     → Odoo.Admin SPA
#   /api/       → Odoo.Server
#   /uploads/   → Odoo.Server static uploads
#   /mcp        → MCP host (ChatGPT / Claude remote)
#   /healthz    → MCP health (optional)

upstream arambh_api {
    server 127.0.0.1:7002;
    keepalive 32;
}

upstream arambh_mcp {
    server 127.0.0.1:7337;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name sportsarena.aarambhevents.in;

    # After certbot, this block usually redirects to HTTPS.
    # certbot --nginx -d sportsarena.aarambhevents.in

    client_max_body_size 25m;

    # --- API ---
    location /api/ {
        proxy_pass http://arambh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://arambh_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- MCP (ChatGPT connector URL: https://sportsarena.aarambhevents.in/mcp) ---
    location /mcp {
        proxy_pass http://arambh_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://arambh_mcp/healthz;
        proxy_set_header Host $host;
    }

    # Built frontends (upload Odoo.Server including out/):
    #   out/admin → /admin/
    #   out/site  → /
    # Change this path if your FileZilla folder name differs.
    location = /admin {
        return 302 /admin/;
    }

    location /admin/ {
        root /workspace/Aarambh-Sports-Arena/Odoo.Server/out;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        root /workspace/Aarambh-Sports-Arena/Odoo.Server/out/site;
        try_files $uri $uri/ /index.html;
    }
}
